# nginx for Haumea Studio's telemetry and crash reports, behind Cloudflare:
# the same rules as the Caddyfile. install-nginx.sh puts it in
# /etc/nginx/sites-available/haumea-server once the certificate exists
# (nginx-haumea-acme.conf gets it first).

# The player's address for the service's rate limits (never stored):
# Cloudflare's CF-Connecting-IP, else the connection's own.
map $http_cf_connecting_ip $haumea_client {
	""      $remote_addr;
	default $http_cf_connecting_ip;
}

server {
	listen 80;
	server_name telemetry.itsneufox.xyz reports.itsneufox.xyz;
	# No access log: it would keep IP addresses.
	access_log off;
	location ^~ /.well-known/acme-challenge/ { root /var/www/haumea-acme; }
	location / { return 301 https://$host$request_uri; }
}

server {
	listen 443 ssl http2;
	server_name telemetry.itsneufox.xyz;
	ssl_certificate /etc/letsencrypt/live/haumea-server/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/haumea-server/privkey.pem;
	access_log off;

	proxy_set_header Host $host;
	proxy_set_header X-Forwarded-For $haumea_client;
	proxy_set_header X-Forwarded-Proto https;

	# Renewals, when Cloudflare sends plain HTTP on to here.
	location ^~ /.well-known/acme-challenge/ { root /var/www/haumea-acme; }
	location = /haumea/telemetry/ping {
		client_max_body_size 1k;
		proxy_pass http://127.0.0.1:8787;
	}
	location = /privacy {
		proxy_pass http://127.0.0.1:8787;
	}
	location / { return 404; }
}

server {
	listen 443 ssl http2;
	server_name reports.itsneufox.xyz;
	ssl_certificate /etc/letsencrypt/live/haumea-server/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/haumea-server/privkey.pem;
	access_log off;

	proxy_set_header Host $host;
	proxy_set_header X-Forwarded-For $haumea_client;
	proxy_set_header X-Forwarded-Proto https;

	location ^~ /.well-known/acme-challenge/ { root /var/www/haumea-acme; }
	location = /haumea/reports {
		client_max_body_size 256k;
		proxy_pass http://127.0.0.1:8787;
	}
	# The dashboard asks for its own password (HTTP basic auth).
	location = /dashboard {
		proxy_pass http://127.0.0.1:8787;
	}
	location ^~ /dashboard/ {
		proxy_pass http://127.0.0.1:8787;
	}
	location / { return 404; }
}
