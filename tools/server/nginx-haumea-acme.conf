# Until the certificate exists: only certbot's challenge, for both names.
# Port 443 too, with Ubuntu's self-signed certificate (ssl-cert), for when
# Cloudflare sends the challenge on over HTTPS ("Always Use HTTPS"; its
# Full mode accepts that certificate). install-nginx.sh replaces this with
# nginx-haumea-server.conf.

server {
	listen 80;
	server_name telemetry.itsneufox.xyz reports.itsneufox.xyz;
	access_log off;
	location ^~ /.well-known/acme-challenge/ { root /var/www/haumea-acme; }
	location / { return 404; }
}

server {
	listen 443 ssl http2;
	server_name telemetry.itsneufox.xyz reports.itsneufox.xyz;
	ssl_certificate /etc/ssl/certs/ssl-cert-snakeoil.pem;
	ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;
	access_log off;
	location ^~ /.well-known/acme-challenge/ { root /var/www/haumea-acme; }
	location / { return 404; }
}
