name: Build Haumea Studio

# main is where Haumea is developed. Releases are beta (a GitHub prerelease)
# or production, and only come from a manual run (Actions > Build Haumea
# Studio > Run workflow) with a channel and a release choice; tags don't
# start this workflow, so publishing a draft (which makes its tag) runs
# nothing. tools/release/release_plan.py decides what a run may release.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      channel:
        description: Channel
        type: choice
        options: [beta, production]
        default: beta
      release:
        description: Release
        type: choice
        options: [build only, draft, publish]
        default: build only
      notes:
        description: Notes above the CHANGELOG section (optional)
        type: string
        required: false

permissions:
  contents: write

env:
  LIBRW: ${{ github.workspace }}/librw
  # No daily ping from anything CI starts (CI alone already stops it).
  HAUMEA_NO_TELEMETRY: 1
  HAUMEA_NO_REPORTS: 1
  # The channel built in: a manual run's choice, "pr" for pull requests and
  # "dev" for everything else.
  CHANNEL: ${{ github.event_name == 'pull_request' && 'pr' || github.event_name == 'workflow_dispatch' && (inputs.channel || 'beta') || 'dev' }}

jobs:
  build-windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      channel: ${{ steps.version.outputs.channel }}

    steps:
      - name: Checkout Haumea Studio
        uses: actions/checkout@v4
        with:
          path: haumea
          fetch-depth: 0

      - name: Checkout librw
        run: git clone --depth=1 https://github.com/aap/librw.git librw

      - name: Apply Haumea patches to librw
        shell: cmd
        working-directory: librw
        run: git apply ..\haumea\patches\librw-haumea.patch

      - name: Restore Haumea multisampling setting in librw
        run: python haumea/tools/release/patch_librw_haumea.py librw

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install Premake5
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/premake/premake-core/releases/download/v5.0.0-beta8/premake-5.0.0-beta8-windows.zip" -OutFile premake5.zip
          Expand-Archive premake5.zip -DestinationPath premake5
          echo "${{ github.workspace }}\premake5" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Download GLFW for Windows
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/glfw/glfw/releases/download/3.3.4/glfw-3.3.4.bin.WIN64.zip" -OutFile glfw.zip
          Expand-Archive glfw.zip -DestinationPath "${{ github.workspace }}"

      - name: Read version from header
        id: version
        shell: pwsh
        working-directory: haumea
        # 1.0.0.<build>, the build being the commit count (as open.mp does).
        run: |
          $ver, $commit = (python tools/release/gen_buildinfo.py --print).Split(" ")
          $branch = "${{ env.CHANNEL }}"
          echo "version=$ver" >> $env:GITHUB_OUTPUT
          echo "commit=$commit" >> $env:GITHUB_OUTPUT
          echo "tag=v${ver}-${branch}" >> $env:GITHUB_OUTPUT
          echo "channel=$branch" >> $env:GITHUB_OUTPUT

      - name: Generate librw project files
        shell: cmd
        working-directory: librw
        run: premake5 vs2019

      - name: Build librw
        shell: cmd
        working-directory: librw/build
        run: msbuild librw.sln /p:Configuration=Release /p:Platform=win-amd64-gl3 /t:librw /m

      - name: Generate Haumea project files
        shell: cmd
        working-directory: haumea
        run: premake5 vs2019 --channel=${{ steps.version.outputs.channel }}

      - name: Build Haumea Studio
        shell: cmd
        working-directory: haumea/build
        run: msbuild librwgta.sln /p:Configuration=Release /p:Platform=win-amd64-gl3 /t:librwgta;haumea /m

      - name: Check the build number and commit (Windows)
        working-directory: haumea
        run: python tools/release/check_buildinfo.py bin/win-amd64-gl3/Release/haumea.exe

      - name: Stage Windows editor bundle
        shell: pwsh
        run: |
          $bundle = Join-Path $env:GITHUB_WORKSPACE "dist\haumea-windows-gl3"
          New-Item -ItemType Directory -Force -Path $bundle | Out-Null
          Copy-Item "haumea\bin\win-amd64-gl3\Release\haumea.exe" $bundle
          $fonts = Join-Path $bundle "fonts"
          New-Item -ItemType Directory -Force -Path $fonts | Out-Null
          Copy-Item "haumea\fonts\*" $fonts -Recurse
          $prefabs = Join-Path $bundle "prefabs"
          New-Item -ItemType Directory -Force -Path $prefabs | Out-Null
          Copy-Item "haumea\tools\haumea\prefabs\*" $prefabs -Recurse
          # Translations: every lang/*.po is a language (tools/haumea/i18n.cpp).
          $lang = Join-Path $bundle "lang"
          New-Item -ItemType Directory -Force -Path $lang | Out-Null
          Copy-Item "haumea\tools\haumea\lang\*.po" $lang
          $glfwDll = "glfw-3.3.4.bin.WIN64\lib-vc2015\glfw3.dll"
          if (!(Test-Path $glfwDll)) { throw 'GLFW DLL missing' }
          Copy-Item $glfwDll $bundle
          # App-local MSVC runtime: portable and per-user installs need no admin setup.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -Directory |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (!$crt) { throw 'MSVC redistributable runtime missing' }
          Copy-Item "$($crt.FullName)\*.dll" $bundle

      - name: Upload Windows editor bundle
        uses: actions/upload-artifact@v4
        with:
          name: haumea-windows-gl3
          path: dist/haumea-windows-gl3/**

      # Crash reports name places as offsets; the PDB turns them into code.
      - name: Upload the Windows symbols
        uses: actions/upload-artifact@v4
        with:
          name: haumea-symbols-windows
          path: haumea/bin/win-amd64-gl3/Release/haumea.pdb
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Haumea Studio
        uses: actions/checkout@v4
        with:
          path: haumea
          fetch-depth: 0

      - name: Checkout librw
        run: git clone --depth=1 https://github.com/aap/librw.git librw

      - name: Apply Haumea patches to librw
        working-directory: librw
        run: git apply ../haumea/patches/librw-haumea.patch

      - name: Restore Haumea multisampling setting in librw
        run: python3 haumea/tools/release/patch_librw_haumea.py librw

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential g++ make \
            libgl-dev libglfw3-dev libsdl2-dev \
            lua5.4 liblua5.4-dev

      - name: Install Premake5
        run: |
          curl -fsSL https://github.com/premake/premake-core/releases/download/v5.0.0-beta8/premake-5.0.0-beta8-linux.tar.gz \
            | tar -xz -C /usr/local/bin premake5
          chmod +x /usr/local/bin/premake5

      - name: Generate librw project files
        working-directory: librw
        run: premake5 gmake2

      - name: Build librw
        working-directory: librw/build
        run: make config=release_linux-amd64-gl3 librw "-j$(nproc)"

      - name: Generate Haumea project files
        working-directory: haumea
        run: premake5 gmake2 --channel=${{ env.CHANNEL }}

      - name: Build Haumea Studio
        working-directory: haumea/build
        run: make config=release_linux-amd64-gl3 librwgta haumea "-j$(nproc)"

      - name: Check the build number and commit (Linux)
        working-directory: haumea
        run: python3 tools/release/check_buildinfo.py bin/linux-amd64-gl3/Release/haumea

      # Release builds have debug information (premake5.lua): it goes into
      # haumea.debug for crash reports, and the editor ships stripped.
      - name: Split off the debug information (Linux)
        working-directory: haumea/bin/linux-amd64-gl3/Release
        run: |
          objcopy --only-keep-debug haumea haumea.debug
          objcopy --strip-debug --strip-unneeded --add-gnu-debuglink=haumea.debug haumea
          python3 ../../../tools/release/make_symbols.py --build-id haumea

      - name: Upload Haumea Studio (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: haumea-linux-gl3
          path: haumea/bin/linux-amd64-gl3/Release/haumea

      - name: Upload the Linux symbols
        uses: actions/upload-artifact@v4
        with:
          name: haumea-symbols-linux
          path: haumea/bin/linux-amd64-gl3/Release/haumea.debug
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout Haumea Studio
        uses: actions/checkout@v4
        with:
          path: haumea
          fetch-depth: 0

      - name: Checkout librw
        run: git clone --depth=1 https://github.com/aap/librw.git librw

      - name: Apply Haumea patches to librw
        working-directory: librw
        run: git apply ../haumea/patches/librw-haumea.patch

      - name: Restore Haumea multisampling setting in librw
        run: python3 haumea/tools/release/patch_librw_haumea.py librw

      - name: Install dependencies
        run: brew install glfw

      - name: Install Premake5
        run: |
          curl -fsSL https://github.com/premake/premake-core/releases/download/v5.0.0-beta8/premake-5.0.0-beta8-macosx.tar.gz \
            | tar -xz -C /usr/local/bin premake5
          chmod +x /usr/local/bin/premake5

      - name: Generate librw project files
        working-directory: librw
        run: premake5 gmake2 --gfxlib=glfw

      - name: Build librw
        working-directory: librw/build
        run: make config=release_macos-arm64-gl3 librw "-j$(sysctl -n hw.ncpu)"

      - name: Generate Haumea project files
        working-directory: haumea
        run: premake5 gmake2 --channel=${{ env.CHANNEL }}

      - name: Build Haumea Studio
        working-directory: haumea/build
        run: make config=release_macos-arm64-gl3 librwgta haumea "-j$(sysctl -n hw.ncpu)"

      - name: Check the build number and commit (macOS)
        working-directory: haumea
        run: python3 tools/release/check_buildinfo.py bin/macos-arm64-gl3/Release/haumea

      - name: Split off the debug information (macOS)
        working-directory: haumea/bin/macos-arm64-gl3/Release
        run: |
          dsymutil haumea -o haumea.dSYM
          strip -S -x haumea
          python3 ../../../tools/release/make_symbols.py --build-id haumea

      - name: Upload Haumea Studio (macOS)
        uses: actions/upload-artifact@v4
        with:
          name: haumea-macos-arm64-gl3
          path: haumea/bin/macos-arm64-gl3/Release/haumea

      - name: Upload the macOS symbols
        uses: actions/upload-artifact@v4
        with:
          name: haumea-symbols-macos
          path: haumea/bin/macos-arm64-gl3/Release/haumea.dSYM
          if-no-files-found: error

  test-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Haumea Studio
        uses: actions/checkout@v4
        with:
          path: haumea
          fetch-depth: 0

      - name: Checkout librw
        run: git clone --depth=1 https://github.com/aap/librw.git librw

      - name: Apply Haumea patches to librw
        working-directory: librw
        run: git apply ../haumea/patches/librw-haumea.patch

      - name: Restore Haumea multisampling setting in librw
        run: python3 haumea/tools/release/patch_librw_haumea.py librw

      # Xvfb and Mesa give the editor an OpenGL 3 display; pawncc is 32-bit.
      - name: Install dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential g++ make libgl-dev libglfw3-dev \
            xvfb xauth libgl1-mesa-dri libglx-mesa0 \
            libc6:i386 libgcc-s1:i386 libatomic1:i386 \
            python3-pil

      - name: Install Premake5
        run: |
          curl -fsSL https://github.com/premake/premake-core/releases/download/v5.0.0-beta8/premake-5.0.0-beta8-linux.tar.gz \
            | tar -xz -C /usr/local/bin premake5
          chmod +x /usr/local/bin/premake5

      - name: Build librw
        working-directory: librw
        run: |
          premake5 gmake2
          make -C build config=release_linux-amd64-gl3 librw "-j$(nproc)"

      - name: Build the editor
        working-directory: haumea
        run: |
          premake5 gmake2 --channel=${{ env.CHANNEL }}
          make -C build config=release_linux-amd64-gl3 librwgta haumea "-j$(nproc)"

      - name: Cache the Pawn toolchain
        uses: actions/cache@v4
        with:
          path: haumea/tools/haumea/tests/pawn/.toolchain
          key: pawn-toolchain-${{ hashFiles('haumea/tools/haumea/tests/pawn/fetch_toolchain.sh') }}

      # No GTA files on the runner: run_all.sh makes a synthetic game folder
      # (tests/fixture/make_game.py), then runs the unit tests, the editor's
      # Pawn round trip (checked against tests/pawn/expected) and compiles
      # the editor's output against open.mp's and SA-MP 0.3.7's includes.
      - name: Run all tests
        working-directory: haumea
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/haumea-config
          LIBGL_ALWAYS_SOFTWARE: "1"
          # The runner has 4 CPUs: two UI scripts at once, and the round
          # trips, compiles and server checks four at a time.
          UI_JOBS: "2"
          TEST_JOBS: "4"
        run: xvfb-run -a -s "-screen 0 1280x800x24" tools/haumea/tests/run_all.sh --fixture

  pawn:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Haumea Studio
        uses: actions/checkout@v4

      - name: Install the 32-bit C library for pawncc
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libc6:i386

      - name: Cache the Pawn toolchain
        uses: actions/cache@v4
        with:
          path: tools/haumea/tests/pawn/.toolchain
          key: pawn-toolchain-${{ hashFiles('tools/haumea/tests/pawn/fetch_toolchain.sh') }}

      # The committed exporter output (pawn/expected) compiles with no errors
      # or warnings against open.mp's and SA-MP 0.3.7's includes; test-linux
      # also compiles what the editor writes now and checks it matches.
      - name: Compile the generated maps
        run: tools/haumea/tests/pawn/check_pawn.sh

  # The Windows build, checked on Linux: cross-compiled with MinGW-w64 (gl3
  # and d3d9), run under a pinned Wine in a fresh prefix, and every test map's
  # --pawn-roundtrip output compared byte for byte with build-linux's editor,
  # plus a capture_screen frame grab of each (tests/windows_check.py). Not in
  # the release job's needs until it has been green for a while.
  windows-wine:
    needs: build-linux
    runs-on: ubuntu-24.04
    env:
      WINE_VERSION: 11.0.0.0~noble-1

    steps:
      - name: Checkout Haumea Studio
        uses: actions/checkout@v4
        with:
          path: haumea
          fetch-depth: 0

      - name: Download the Linux editor
        uses: actions/download-artifact@v4
        with:
          name: haumea-linux-gl3
          path: haumea/bin/linux-amd64-gl3/Release

      # build-windows-mingw.sh lists the sources from premake's makefiles.
      - name: Install Premake5
        run: |
          curl -fsSL https://github.com/premake/premake-core/releases/download/v5.0.0-beta8/premake-5.0.0-beta8-linux.tar.gz \
            | sudo tar -xz -C /usr/local/bin premake5
          sudo chmod +x /usr/local/bin/premake5

      - name: Cache the WineHQ packages
        id: wine-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/winehq-debs
          key: winehq-${{ env.WINE_VERSION }}

      # WineHQ's own packages at a fixed version, so a Wine update can't change
      # the result; MinGW-w64, Xvfb and Mesa from Ubuntu.
      - name: Install Wine, MinGW-w64 and Xvfb
        run: |
          sudo dpkg --add-architecture i386
          sudo mkdir -pm755 /etc/apt/keyrings
          sudo curl -fsSL -o /etc/apt/keyrings/winehq-archive.key https://dl.winehq.org/wine-builds/winehq.key
          sudo curl -fsSL -o /etc/apt/sources.list.d/winehq-noble.sources \
            https://dl.winehq.org/wine-builds/ubuntu/dists/noble/winehq-noble.sources
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mingw-w64 xvfb xauth libgl1-mesa-dri libglx-mesa0 libglfw3
          DEBS="${{ runner.temp }}/winehq-debs"
          if [ -n "$(ls "$DEBS"/*.deb 2>/dev/null)" ]; then
            sudo apt-get install -y --no-install-recommends "$DEBS"/*.deb
          else
            sudo apt-get install -y --no-install-recommends \
              winehq-stable=$WINE_VERSION wine-stable=$WINE_VERSION \
              wine-stable-amd64=$WINE_VERSION wine-stable-i386=$WINE_VERSION
            mkdir -p "$DEBS"
            cp /var/cache/apt/archives/*wine*.deb "$DEBS"/ || true
          fi
          wine --version

      - name: Check the Windows build under Wine
        working-directory: haumea
        env:
          HAUMEA_BINARY: ${{ github.workspace }}/haumea/bin/linux-amd64-gl3/Release/haumea
          CC: x86_64-w64-mingw32-gcc-posix
          CXX: x86_64-w64-mingw32-g++-posix
          TMPDIR: ${{ runner.temp }}/windows-check
          LIBGL_ALWAYS_SOFTWARE: "1"
          # It already runs inside xvfb-run: without this, the guard against
          # opening editors on a real display (haumea_test_env.py) refuses to
          # start. And no Wayland or desktop runtime folder to find, as run_all.sh
          # sets them.
          HAUMEA_TEST_XVFB: "1"
          WAYLAND_DISPLAY: /nonexistent/haumea-test
          XDG_SESSION_TYPE: x11
          XDG_RUNTIME_DIR: ${{ runner.temp }}/xdg-runtime
        run: |
          chmod +x "$HAUMEA_BINARY"
          mkdir -p "$TMPDIR"
          mkdir -m 700 -p "$XDG_RUNTIME_DIR"
          xvfb-run -a -s "-screen 0 1600x1000x24" python3 tools/haumea/tests/windows_check.py

      - name: Upload the work folder on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-check
          path: ${{ runner.temp }}/windows-check

  # The Namaka bundle for Linux: build-linux's editor, the haumea_agent
  # wheel and a wheelhouse with every wheel for CPython 3.14 and the pure ones
  # for 3.10-3.13 (tools/release/fetch_wheelhouse.sh). The bundle's
  # setup-agent.sh runs on each of 3.10-3.14 (the others download only their
  # binary wheels); a clean ubuntu:26.04 (3.14) with no network sets it up as a
  # user would, checking the editor's libraries and the MCP tool count, and a
  # clean ubuntu:24.04 (3.12) with no network must stop with the
  # "needs Python 3.14" message. Not in the release job's needs until it has
  # been green for a while.
  agent-bundle-linux:
    needs: build-linux
    runs-on: ubuntu-24.04
    env:
      # Bump this when MCP tools are added or removed on purpose.
      AGENT_MCP_TOOLS: 83
      BUNDLE: Haumea-Namaka-linux-x86_64

    steps:
      - name: Checkout Haumea Studio
        uses: actions/checkout@v4
        with:
          path: haumea
          fetch-depth: 0

      - name: Download the Linux editor
        uses: actions/download-artifact@v4
        with:
          name: haumea-linux-gl3
          path: dist/engine

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.7"

      - name: Build the wheel and the wheelhouse
        run: |
          python3 haumea/tools/release/gen_buildinfo.py --python haumea/tools/agent/_version.py
          uv build --wheel -o dist/wheel haumea
          haumea/tools/release/fetch_wheelhouse.sh linux dist/wheelhouse
          # Every bundled package is credited (GPL release; THIRD_PARTY_NOTICES.md).
          python3 haumea/tools/release/check_notices.py dist/wheelhouse haumea/THIRD_PARTY_NOTICES.md

      # Artifacts lose the executable bit; package_agent.py keeps the mode.
      - name: Package the bundle
        run: |
          chmod +x dist/engine/haumea
          python3 haumea/tools/release/package_agent.py --engine dist/engine/haumea \
            --wheel dist/wheel/haumea_namaka-*.whl --wheelhouse dist/wheelhouse \
            --output dist/agent --name "$BUNDLE"

      # The bundle's own setup-agent.sh, with each Python as python3.
      - name: Set up the bundle on CPython 3.10-3.14
        run: |
          for v in 3.10 3.11 3.12 3.13 3.14; do
            uv python install -q "$v"
            mkdir -p "$RUNNER_TEMP/bin$v" "$RUNNER_TEMP/py$v"
            ln -sf "$(uv python find "$v")" "$RUNNER_TEMP/bin$v/python3"
            (cd "$RUNNER_TEMP/py$v" && unzip -q "$GITHUB_WORKSPACE/dist/agent/$BUNDLE.zip")
            (cd "$RUNNER_TEMP/py$v/$BUNDLE" && PATH="$RUNNER_TEMP/bin$v:$PATH" ./setup-agent.sh > setup.log 2>&1) ||
              { tail -30 "$RUNNER_TEMP/py$v/$BUNDLE/setup.log"; exit 1; }
            grep -E '^(Python|Namaka)' "$RUNNER_TEMP/py$v/$BUNDLE/setup.log"
            mcp="$RUNNER_TEMP/py$v/$BUNDLE/.venv-agent/bin/haumea-mcp"
            "$(dirname "$mcp")/python" haumea/tools/release/check_agent_bundle.py "$mcp" \
              --tools "$AGENT_MCP_TOOLS" | cut -c1-80
          done

      # docker cp rather than bind mounts, so this also runs under act.
      - name: Set up the bundle offline in clean ubuntu:26.04 and 24.04
        run: |
          for image in ubuntu:26.04 ubuntu:24.04; do
            tag=$(echo "$image" | tr ':.' '--')-$GITHUB_RUN_ID
            docker run --name "agent-base-$tag" "$image" sh -c '
              apt-get update -q && apt-get install -yq --no-install-recommends \
                python3 python3-venv libglfw3 unzip >/dev/null'
            docker commit "agent-base-$tag" "agent-base-$tag:ci" >/dev/null
            docker create --name "agent-test-$tag" --network none -w /root \
              "agent-base-$tag:ci" sleep infinity
            docker cp "dist/agent/$BUNDLE.zip" "agent-test-$tag:/root/"
            docker cp haumea/tools/release/check_agent_bundle.py "agent-test-$tag:/root/"
            docker start "agent-test-$tag"
          done
          # Python 3.14: everything offline.
          docker exec -e BUNDLE -e AGENT_MCP_TOOLS "agent-test-ubuntu-26-04-$GITHUB_RUN_ID" sh -ec '
            unzip -q "$BUNDLE.zip" && cd "$BUNDLE"
            sha256sum -c --quiet SHA256SUMS
            test -x haumea && test -x setup-agent.sh
            if ldd ./haumea | grep "not found"; then exit 1; fi
            ./setup-agent.sh
            .venv-agent/bin/python /root/check_agent_bundle.py .venv-agent/bin/haumea-mcp \
              --tools "$AGENT_MCP_TOOLS"
            .venv-agent/bin/haumeactl --help >/dev/null'
          # Python 3.12 with no network: a clear stop, not a pip traceback.
          docker exec -e BUNDLE "agent-test-ubuntu-24-04-$GITHUB_RUN_ID" sh -c '
            unzip -q "$BUNDLE.zip" && cd "$BUNDLE"
            if ./setup-agent.sh > log 2>&1; then echo "setup worked offline on 3.12?"; exit 1; fi
            grep -F "needs Python 3.14 to install offline, or an internet connection" log'

      - name: Remove the test containers
        if: always()
        run: |
          for tag in ubuntu-26-04-$GITHUB_RUN_ID ubuntu-24-04-$GITHUB_RUN_ID; do
            docker rm -f "agent-base-$tag" "agent-test-$tag" || true
            docker rmi "agent-base-$tag:ci" || true
          done

      - name: Upload the Linux Namaka bundle
        uses: actions/upload-artifact@v4
        with:
          name: haumea-namaka-linux-x86_64
          path: dist/agent/${{ env.BUNDLE }}.zip

  # The Namaka companion for Windows, with the MinGW-w64 editor
  # (tools/release/build-windows-mingw.sh gl3; windows-wine checks that build
  # under Wine) and a Windows CPython 3.10-3.14 wheelhouse. setup-agent.ps1
  # can't run here, so this checks that every wheelhouse Python resolves the
  # wheel from the wheelhouse alone.
  agent-bundle-windows:
    runs-on: ubuntu-24.04
    env:
      BUNDLE: Haumea-Namaka-windows-x86_64

    steps:
      - name: Checkout Haumea Studio
        uses: actions/checkout@v4
        with:
          path: haumea
          fetch-depth: 0

      - name: Install MinGW-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mingw-w64

      # build-windows-mingw.sh lists the sources from premake's makefiles.
      - name: Install Premake5
        run: |
          curl -fsSL https://github.com/premake/premake-core/releases/download/v5.0.0-beta8/premake-5.0.0-beta8-linux.tar.gz \
            | sudo tar -xz -C /usr/local/bin premake5
          sudo chmod +x /usr/local/bin/premake5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.7"

      - name: Build the editor with MinGW-w64
        env:
          CC: x86_64-w64-mingw32-gcc-posix
          CXX: x86_64-w64-mingw32-g++-posix
          WORK: ${{ runner.temp }}/mingw
        run: haumea/tools/release/build-windows-mingw.sh gl3

      - name: Build the wheel and the wheelhouse
        run: |
          python3 haumea/tools/release/gen_buildinfo.py --python haumea/tools/agent/_version.py
          uv build --wheel -o dist/wheel haumea
          haumea/tools/release/fetch_wheelhouse.sh windows dist/wheelhouse
          # Every bundled package is credited (GPL release; THIRD_PARTY_NOTICES.md).
          python3 haumea/tools/release/check_notices.py dist/wheelhouse haumea/THIRD_PARTY_NOTICES.md

      # Python 3.14 installs from the wheelhouse alone; the others have their
      # pins there and download only their binary wheels.
      - name: Check the wheelhouse resolves offline
        run: |
          uv pip compile -q --no-index --find-links dist/wheelhouse --find-links dist/wheel \
            --only-binary :all: --python-version 3.14 --python-platform x86_64-pc-windows-msvc \
            -o "$RUNNER_TEMP/resolved.txt" - <<< "haumea-namaka[mcp]"
          for v in 3.10 3.11 3.12 3.13 3.14; do test -s "dist/wheelhouse/constraints-$v.txt"; done

      - name: Package the companion
        run: |
          python3 haumea/tools/release/package_alpha_companion.py \
            --engine "$RUNNER_TEMP/mingw/win-amd64-gl3/haumea.exe" \
            --wheel dist/wheel/haumea_namaka-*.whl --wheelhouse dist/wheelhouse \
            --output dist/agent --name "$BUNDLE"

      - name: Upload the Windows Namaka companion
        uses: actions/upload-artifact@v4
        with:
          name: haumea-namaka-windows-x86_64
          path: dist/agent/${{ env.BUNDLE }}.zip

  installer-windows:
    needs: [build-windows, agent-bundle-windows]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: haumea
      - uses: actions/download-artifact@v4
        with:
          name: haumea-windows-gl3
          path: dist/windows
      - uses: actions/download-artifact@v4
        with:
          name: haumea-namaka-windows-x86_64
          path: dist/namaka
      - name: Stage the complete Windows distribution
        shell: pwsh
        run: |
          python haumea/tools/release/package_downloads.py --platform windows `
            --engine dist/windows/haumea.exe --glfw dist/windows/glfw3.dll `
            --namaka dist/namaka/Haumea-Namaka-windows-x86_64.zip `
            --stage dist/windows-bundle --output dist/portable
      - name: Build the Windows installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) { choco install innosetup --version=6.7.3 --yes --no-progress }
          if (!(Test-Path $compiler)) { throw 'Inno Setup compiler not found' }
          & $compiler "/DBundleDir=$env:GITHUB_WORKSPACE\dist\windows-bundle" `
            "/DOutputDir=$env:GITHUB_WORKSPACE\dist\setup" `
            "/DAppVersion=${{ needs.build-windows.outputs.version }}" haumea/tools/release/haumea.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
      - name: Check installation and uninstallation
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP 'Haumea install test'
          $setup = Start-Process dist/setup/Haumea-Studio-Windows-Setup.exe -Wait -PassThru `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$dest`""
          if ($setup.ExitCode -ne 0) { throw 'Installation failed' }
          foreach ($file in @('haumea.exe', 'glfw3.dll', 'START_HERE.txt', 'lang/pt-BR.po', 'namaka/namaka_install.py')) {
            if (!(Test-Path (Join-Path $dest $file))) { throw "Missing installed file: $file" }
          }
          & "$dest/haumea.exe" --version
          if ($LASTEXITCODE -ne 0) { throw 'Installed editor does not start' }
          Set-Content "$dest/keep-map.pwn" '// user map'
          $uninstall = Start-Process "$dest/unins000.exe" -Wait -PassThru `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          if ($uninstall.ExitCode -ne 0) { throw 'Uninstallation failed' }
          if (Test-Path "$dest/haumea.exe") { throw 'Editor was not uninstalled' }
          if (!(Test-Path "$dest/keep-map.pwn")) { throw 'Uninstall removed a user map' }
      - uses: actions/upload-artifact@v4
        with:
          name: haumea-windows-installer
          path: dist/setup/Haumea-Studio-Windows-Setup.exe
          if-no-files-found: error

  release:
    # A manual run asking for a draft or a release.
    if: github.event_name == 'workflow_dispatch' && inputs.release != 'build only'
    needs: [build-windows, build-linux, build-macos, test-linux, pawn, agent-bundle-linux, agent-bundle-windows, installer-windows]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Haumea Studio
        uses: actions/checkout@v4
        with:
          path: haumea
          fetch-depth: 0

      # Production only from main, never over an existing tag:
      # tools/release/release_plan.py.
      - name: Plan the release
        id: plan
        working-directory: haumea
        run: |
          version='${{ needs.build-windows.outputs.version }}'
          tag="v$version-$CHANNEL"
          git fetch -q origin main
          # On main: run from the main branch itself, at a commit on it.
          on_main=no; git merge-base --is-ancestor "$GITHUB_SHA" origin/main && on_main=yes
          [ "$GITHUB_REF_NAME" != main ] && on_main=no
          exists=no; [ -n "$(git ls-remote --tags origin "refs/tags/$tag")" ] && exists=yes
          python3 tools/release/release_plan.py --event "$GITHUB_EVENT_NAME" --ref-type "$GITHUB_REF_TYPE" \
            --ref-name "$GITHUB_REF_NAME" --version "$version" --channel "$CHANNEL" \
            --release '${{ inputs.release }}' --on-main $on_main --tag-exists $exists > "$RUNNER_TEMP/plan.txt"
          cat "$RUNNER_TEMP/plan.txt" | tee -a "$GITHUB_OUTPUT"

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: haumea-windows-gl3
          path: dist/windows

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: haumea-linux-gl3
          path: dist/linux

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: haumea-macos-arm64-gl3
          path: dist/macos

      - name: Download the symbols
        uses: actions/download-artifact@v4
        with:
          pattern: haumea-symbols-*
          path: dist/symbols

      - name: Download the Namaka bundles
        uses: actions/download-artifact@v4
        with:
          pattern: haumea-namaka-*
          path: dist/namaka

      - name: Download the Windows installer
        uses: actions/download-artifact@v4
        with:
          name: haumea-windows-installer
          path: dist/release

      # One portable per platform; Namaka is included in Windows and Linux.
      # The tar names remain stable for editors already using auto-update.
      - name: Make the portable downloads, Linux installer and SHA256SUMS
        run: |
          python3 haumea/tools/release/package_downloads.py --platform windows \
            --engine dist/windows/haumea.exe --glfw dist/windows/glfw3.dll \
            --namaka dist/namaka/haumea-namaka-windows-x86_64/Haumea-Namaka-windows-x86_64.zip \
            --stage dist/windows-bundle --output dist/release
          python3 haumea/tools/release/package_downloads.py --platform linux \
            --engine dist/linux/haumea \
            --namaka dist/namaka/haumea-namaka-linux-x86_64/Haumea-Namaka-linux-x86_64.zip \
            --stage dist/linux-bundle --output dist/release
          python3 haumea/tools/release/package_downloads.py --platform macos \
            --engine dist/macos/haumea --stage dist/macos-bundle --output dist/release
          # The symbols for crash reports (tools/server/symbols.py reads this zip);
          # not part of any bundle.
          python3 haumea/tools/release/make_symbols.py \
            "dist/release/haumea-symbols-${{ needs.build-windows.outputs.version }}.zip" \
            --linux dist/linux/haumea dist/symbols/haumea-symbols-linux/haumea.debug \
            --windows dist/windows/haumea.exe dist/symbols/haumea-symbols-windows/haumea.pdb \
            --macos dist/macos/haumea dist/symbols/haumea-symbols-macos
          (cd dist/release && sha256sum * > SHA256SUMS && cat SHA256SUMS)

      # What's new in the editor's update banner: the run's notes, if any, then
      # this version's CHANGELOG section.
      - name: Write the release notes
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          version='${{ needs.build-windows.outputs.version }}'
          {
            if [ -n "$NOTES" ]; then printf '%s\n\n' "$NOTES"; fi
            echo "Haumea Studio $version, channel **${{ steps.plan.outputs.channel }}**"
            echo
            echo '## Downloads'
            echo
            echo '| Platform | Install (recommended) | Portable |'
            echo '| --- | --- | --- |'
            base="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/${{ steps.plan.outputs.tag }}"
            echo "| Windows 64-bit | [Setup.exe]($base/Haumea-Studio-Windows-Setup.exe) | [Portable ZIP]($base/Haumea-Studio-Windows-Portable.zip) |"
            echo "| Linux x86_64 | [Setup.run]($base/Haumea-Studio-Linux-Setup.run) | [Portable tar.gz]($base/haumea-linux-amd64.tar.gz) |"
            echo "| macOS Apple Silicon | | [Portable ZIP]($base/Haumea-Studio-macOS-Apple-Silicon-Portable.zip) |"
            echo
            echo 'Download **one file** for your platform. Windows and Linux include Namaka; no companion ZIP is needed.'
            echo 'Windows: run Setup.exe, or extract the entire portable ZIP and open haumea.exe.'
            echo 'Linux: run `sh Haumea-Studio-Linux-Setup.run` (Python 3.10+, libglfw3 and curl required).'
            echo 'macOS: install GLFW (`brew install glfw`), extract the ZIP and run `./haumea` from its folder.'
            echo
            echo 'The Windows `.tar.gz` is used by the built-in updater. The symbols ZIP is for crash reports, and SHA256SUMS verifies downloads. These are not extra installs.'
            echo
            python3 haumea/tools/release/changelog_section.py "${version%.*}" haumea/CHANGELOG.md || true
            echo
            echo "Haumea Studio is free software under the GNU General Public License, version 2 or later."
            echo "Source code: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/tree/${{ steps.plan.outputs.tag }}"
          } > dist/notes.md
          cat dist/notes.md

      # Under act (local checks) everything above runs, but nothing is published.
      - name: Create GitHub Release
        if: env.ACT != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.plan.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Haumea Studio ${{ needs.build-windows.outputs.version }} (${{ steps.plan.outputs.channel }})
          body_path: dist/notes.md
          files: dist/release/*
          draft: ${{ steps.plan.outputs.release == 'draft' }}
          prerelease: ${{ steps.plan.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.plan.outputs.latest }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
